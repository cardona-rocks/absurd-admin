# Railway: build con Dockerfile y servido como SPA por server.js.
#
# Se fuerza el builder de Docker a propósito. El automático monta cachés dentro
# de node_modules y `npm ci` no puede borrar un punto de montaje, así que el
# build moría con EBUSY en node_modules/.vite.
#
# Hay que definir VITE_API_URL en las variables del servicio, con el dominio
# público de la API (por ejemplo https://absurd-api-production.up.railway.app).
# Vite la incrusta en el bundle durante el build: si la cambias, vuelve a
# desplegar — reiniciar no basta.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
restartPolicyType = "on_failure"
